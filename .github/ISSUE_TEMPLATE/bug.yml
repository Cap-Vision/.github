name: Bug
description: Signaler un comportement inattendu
type: Bug
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Version de l'application concernée.
    validations:
      required: false
  - type: textarea
    id: comportement-actuel
    attributes:
      label: Comportement actuel
      description: Ce qui se passe actuellement.
    validations:
      required: true
  - type: textarea
    id: comportement-attendu
    attributes:
      label: Comportement attendu
      description: Ce qui devrait se passer.
    validations:
      required: true
  - type: textarea
    id: etapes-de-reproduction
    attributes:
      label: Étapes de reproduction
      description: Les étapes pour reproduire le problème.
    validations:
      required: true
